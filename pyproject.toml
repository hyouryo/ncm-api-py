[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "ncm-api-py"
description = "网易云音乐 API 的 Python 绑定，基于 PyO3 封装 ncm-api-rs"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{ name = "hyouryo" }]
keywords = ["netease", "music", "api", "ncm", "pyo3"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/hyouryo/ncm-api-py"
Repository = "https://github.com/hyouryo/ncm-api-py"
Issues = "https://github.com/hyouryo/ncm-api-py/issues"

[tool.maturin]
# Cargo 包名带连字符，模块名是下划线形式；显式声明后 maturin 与
# pyo3-stub-gen 才会认成同一个模块（否则会报"多个模块"）。
module-name = "ncm_api_py"
# 开启 CPython stable ABI：产物是单个 cp310-abi3 wheel，3.10+ 通用。
features = ["extension-module", "abi3"]
# 显式限定 sdist 的内容：默认会把 dist/ 里的构建产物（wheel、旧 sdist）
# 一并打包进去，必须在 CI 之前就挡掉。
# 注意 format = "sdist"：不加这个限定的话，这些文件也会被塞进 wheel 根目录
# （Cargo.toml / src/ 等源码泄漏到 wheel 里）。
include = [
    { path = "src/**/*.rs", format = "sdist" },
    { path = "Cargo.toml", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "pyproject.toml", format = "sdist" },
    { path = "README.md", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "ncm_api_py.pyi", format = "sdist" },
    { path = "checks/**/*.py", format = "sdist" },
]

[tool.ruff]
target-version = "py310"
# ncm_api_py.pyi 由 pyo3-stub-gen 生成（cargo run --bin stub_gen），
# 不参与手写代码的风格检查。
extend-exclude = ["target", "dist", "ncm_api_py.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PYI"]
