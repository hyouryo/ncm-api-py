# 发布流程：在 GitHub 上创建（发布）Release 时构建各平台 wheel 并发布到 PyPI。
#
# 使用 PyPI Trusted Publishing（OIDC），不需要在仓库里存任何 token。
# 首次发布前需要在 PyPI 配置一次 Trusted Publisher：
#   https://pypi.org/manage/account/publishing/
#     PyPI Project Name : ncm-api-py
#     Owner             : hyouryo
#     Repository name   : ncm-api-py
#     Workflow name     : Release.yml
#     Environment name  : pypi
# 若 ncm-api-py 在 PyPI 上还不存在，请填 "pending publisher"，首次发布后会自动转为正式项目。
#
# 触发方式：
#   1. 发布 Release（release: published）—— 构建并上传 PyPI。
#   2. 手动 workflow_dispatch —— 默认只构建、不上传（排练）；勾选 publish 才会上传。
#      想完整验证「上传」这一步，更推荐用「草稿 Release」：草稿不会触发任何运行，
#      点 Publish 时才走路径 1。

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "真的上传到 PyPI（默认关闭，只做构建排练）"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 保留原生编译器命令以诊断失败；不禁用 cc 的平台默认 flags。
  CC_ENABLE_DEBUG_OUTPUT: "1"

jobs:
  # ---------- 版本号校验：挡住「tag 与 Cargo.toml 不一致」就发布 ----------
  # 版本号唯一来源是 Cargo.toml 的 version（pyproject.toml 用的是 dynamic version），
  # maturin 不看 git tag。所以 tag 写错不会有任何报错，只会静默发出错误的版本号，
  # 而 PyPI 上那个版本号一旦被占用就再也改不了。这里先检查，避免白发一轮。
  version:
    name: tag 与版本号一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          have="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' Cargo.toml | head -1)"
          # tag 是外部输入，必须经环境变量传入，不能直接插值为 shell 代码。
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            echo "手动触发（无 tag），当前版本为 $have —— 只做构建排练，跳过校验"
            exit 0
          fi
          want="${tag#v}"          # 允许 tag 带或不带 v 前缀
          echo "tag=$tag  Cargo.toml=$have"
          if [ "$want" != "$have" ]; then
            echo "::error::tag ($tag) 与 Cargo.toml 的 version ($have) 不一致。"
            echo "::error::请把 Cargo.toml 改成 \"$want\" 后重新提交，再发布 Release。"
            exit 1
          fi
          echo "一致：$have"

  # ---------- 各平台构建 wheel ----------
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 保留两个发布架构，改用原生 ARM，避免 native C/ASM 交叉工具链错配。
        # ubuntu-24.04-arm 需要仓库可使用 GitHub-hosted ARM runner。
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
          # 保持现有 glibc 2.28 下限；使用各架构的原生 manylinux 工具链。
          manylinux: manylinux_2_28
      - name: Install and test wheel
        run: |
          ls dist/*abi3*.whl
          python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
          python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # musl ARM 也使用原生 runner，保留原有两个发布架构。
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
          manylinux: musllinux_1_2
      - name: Install and test wheel in musl environment
        # musl wheel 不能装进 Ubuntu/glibc；使用对应架构 Alpine Python。
        run: |
          ls dist/*abi3*.whl
          docker pull python:3.14-alpine
          docker run --rm --network none \
            -v "${PWD}/dist:/dist:ro" \
            -v "${PWD}/tests:/tests:ro" \
            python:3.14-alpine sh -c \
            'python -m pip install --no-index --find-links /dist ncm-api-py && python -m unittest discover -s /tests -p "test_*.py"'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    env:
      # 缩短原生编译器参数中的产物路径，而不是全局禁用 cc flags。
      CARGO_TARGET_DIR: ${{ runner.temp }}/ncm-target
    strategy:
      fail-fast: false
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # abi3 只出一个 wheel，不再需要多版本解释器
          python-version: "3.14"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
      - name: Install and test wheel
        shell: bash
        run: |
          ls dist/*abi3*.whl
          python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
          python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/ncm-target
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: "true"
      - name: Check wheel
        run: |
          ls dist/*abi3*.whl
          # macos-latest 是 ARM runner，x86_64 交叉产物只校验文件。
          if [ "${{ matrix.target }}" = "aarch64" ]; then
            python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
            python -m unittest discover -s tests -p 'test_*.py'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ---------- 发布到 PyPI ----------
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # 只有两种情况才进入本 job（即真正发布）：
    #   1. 发布了 Release（release: published）；
    #   2. 手动触发时勾选了 publish。
    # 手动触发不勾 publish = 只跑上面 5 个构建 job 的排练，不会碰 PyPI。
    if: ${{ github.event_name == 'release' || inputs.publish }}
    needs: [version, linux, musllinux, windows, macos, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/ncm-api-py
    permissions:
      # Trusted Publishing 必需：用 OIDC 换取 PyPI 的短期凭据
      id-token: write
      # 用于生成构建来源证明（attestation）
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List collected artifacts
        run: ls -l dist
      # 能走到这里就说明确实要发布，所以这两步不需要额外条件
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
