# 发布流程：在 GitHub 上创建（发布）Release 时构建各平台 wheel 并发布到 PyPI。
#
# 使用 PyPI Trusted Publishing（OIDC），不需要在仓库里存任何 token。
# 首次发布前需要在 PyPI 配置一次 Trusted Publisher：
#   https://pypi.org/manage/account/publishing/
#     PyPI Project Name : ncm-api-py
#     Owner             : hyouryo
#     Repository name   : ncm-api-py
#     Workflow name     : Release.yml
#     Environment name  : pypi
# 若 ncm-api-py 在 PyPI 上还不存在，请填 "pending publisher"，首次发布后会自动转为正式项目。
#
# 触发方式：
#   1. 发布 Release（release: published）—— 构建并上传 PyPI。
#   2. 手动 workflow_dispatch —— 默认只构建、不上传（排练）；勾选 publish 才会上传。
#      想完整验证「上传」这一步，更推荐用「草稿 Release」：草稿不会触发任何运行，
#      点 Publish 时才走路径 1。

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "真的上传到 PyPI（默认关闭，只做构建排练）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ---------- 版本号校验：挡住「tag 与 Cargo.toml 不一致」就发布 ----------
  # 版本号唯一来源是 Cargo.toml 的 version（pyproject.toml 用的是 dynamic version），
  # maturin 不看 git tag。所以 tag 写错不会有任何报错，只会静默发出错误的版本号，
  # 而 PyPI 上那个版本号一旦被占用就再也改不了。这里先检查，避免白发一轮。
  version:
    name: tag 与版本号一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          set -euo pipefail
          have="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' Cargo.toml | head -1)"
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            echo "手动触发（无 tag），当前版本为 $have —— 只做构建排练，跳过校验"
            exit 0
          fi
          want="${tag#v}"          # 允许 tag 带或不带 v 前缀
          echo "tag=$tag  Cargo.toml=$have"
          if [ "$want" != "$have" ]; then
            echo "::error::tag ($tag) 与 Cargo.toml 的 version ($have) 不一致。"
            echo "::error::请把 Cargo.toml 改成 \"$want\" 后重新提交，再发布 Release。"
            exit 1
          fi
          echo "一致：$have"

  # ---------- 各平台构建 wheel ----------
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
          # 必须是 manylinux_2_28 而不是 auto(=manylinux2014)：那个 cross 镜像基于
          # CentOS 7 / GCC 4.8，不会预定义 __ARM_ARCH，导致 ring 的 ARM 汇编编译失败。
          # 2_28 的 GCC 足够新；代价是 glibc 下限从 2.17 提到 2.28
          # （CentOS 8+ / Debian 10+ / Ubuntu 20.04+）。
          manylinux: manylinux_2_28
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # abi3 只出一个 wheel，不再需要多版本解释器
          python-version: "3.14"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ---------- 发布到 PyPI ----------
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # 只有两种情况才进入本 job（即真正发布）：
    #   1. 发布了 Release（release: published）；
    #   2. 手动触发时勾选了 publish。
    # 手动触发不勾 publish = 只跑上面 5 个构建 job 的排练，不会碰 PyPI。
    if: ${{ github.event_name == 'release' || inputs.publish }}
    needs: [version, linux, musllinux, windows, macos, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/ncm-api-py
    permissions:
      # Trusted Publishing 必需：用 OIDC 换取 PyPI 的短期凭据
      id-token: write
      # 用于生成构建来源证明（attestation）
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List collected artifacts
        run: ls -l dist
      # 能走到这里就说明确实要发布，所以这两步不需要额外条件
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
