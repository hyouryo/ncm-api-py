# 持续集成：在 push / PR 上做格式、静态检查与构建验证。
#
# 这里刻意不做任何发布动作。发布由 Release.yml 负责，只在
# 「发布 Release」或手动触发时执行，避免同一份产物被推两次。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt / clippy / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --features extension-module -- -D warnings
      - uses: astral-sh/setup-uv@v7
      - name: ruff
        run: uvx ruff check

  build-linux:
    name: build wheel (linux ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # auto(=manylinux2014) 的 cross 镜像 GCC 太老，ring 的 ARM 汇编会编译失败
          manylinux: manylinux_2_28
          args: --release --out dist
      - name: Check wheel
        run: |
          ls -l dist
          ls dist/*abi3*.whl
          # aarch64 是交叉编译产物，装不进 x86_64 runner，只校验产物名
          if [ "${{ matrix.target }}" = "x86_64" ]; then
            python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
            python -c "import ncm_api_py; print('import OK:', ncm_api_py.__file__)"
          fi

  build-native:
    name: build wheel (${{ matrix.runner }}/${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Check wheel
        shell: bash
        run: |
          ls -l dist
          ls dist/*abi3*.whl
          python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
          python -c "import ncm_api_py; print('import OK:', ncm_api_py.__file__)"
