# 持续集成：格式、静态检查、Rust 测试和安装后的离线 Python 测试。
# 发布由 Release.yml 负责，CI 不上传 PyPI。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 失败时保留 cc 的实际编译器/命令证据，不禁用它的目标平台默认 flags。
  CC_ENABLE_DEBUG_OUTPUT: "1"

jobs:
  lint:
    name: fmt / clippy / Rust tests / ruff / mypy
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/ncm-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v7
      - name: cargo fmt
        run: cargo fmt --all --check
      # 测试可执行文件需要链接 libpython，不能开启 extension-module。
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --all-targets --locked
      - name: ruff check
        run: uvx ruff check
      - name: ruff format check
        run: uvx ruff format --check
      - name: mypy strict
        run: uvx mypy --strict tests/typecheck.py

  build-linux:
    name: build wheel (${{ matrix.manylinux }}/${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 原生 ARM 避免把 host cc/clang 的默认目标误用到 ring 的 ARM 汇编。
        # ubuntu-24.04-arm 需要仓库可使用 GitHub-hosted ARM runner。
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: manylinux_2_28
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: manylinux_2_28
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # 保持现有 glibc 2.28 下限；musl 使用独立镜像和测试环境。
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Check wheel files
        run: |
          ls -l dist
          ls dist/*abi3*.whl
      - name: Install and test manylinux wheel
        if: matrix.manylinux == 'manylinux_2_28'
        run: |
          python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Install and test musllinux wheel
        if: matrix.manylinux == 'musllinux_1_2'
        # Ubuntu 使用 glibc，不能直接安装 musl wheel；容器与 runner 架构一致。
        # 先拉镜像，再禁用网络运行测试，确保测试不依赖外网 API。
        run: |
          docker pull python:3.14-alpine
          docker run --rm --network none \
            -v "${PWD}/dist:/dist:ro" \
            -v "${PWD}/tests:/tests:ro" \
            python:3.14-alpine sh -c \
            'python -m pip install --no-index --find-links /dist ncm-api-py && python -m unittest discover -s /tests -p "test_*.py"'
      - uses: actions/setup-python@v5
        if: matrix.manylinux == 'manylinux_2_28'
        with:
          python-version: "3.10"
      - name: Test same abi3 wheel on Python 3.10
        if: matrix.manylinux == 'manylinux_2_28'
        run: |
          python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
          python -m unittest discover -s tests -p 'test_*.py'

  build-native:
    name: build wheel (${{ matrix.runner }}/${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      # 缩短 Windows 原生编译器参数中的产物路径，不牺牲 cc 默认 flags。
      CARGO_TARGET_DIR: ${{ runner.temp }}/ncm-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - name: Install and test wheel on Python 3.14
        shell: bash
        run: |
          ls -l dist
          ls dist/*abi3*.whl
          python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
          python -m unittest discover -s tests -p 'test_*.py'
      # setup-python 的 3.10 缺少原生 macOS ARM 发行，用 uv managed Python。
      - uses: astral-sh/setup-uv@v7
      - name: Install Python 3.10
        run: uv python install 3.10
      - name: Test same abi3 wheel on Python 3.10
        shell: bash
        run: |
          uv run --offline --no-project --python 3.10 \
            --with ncm-api-py --no-index --find-links dist \
            python -m unittest discover -s tests -p 'test_*.py'
