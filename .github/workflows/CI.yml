# 持续集成：在 push / PR 上做格式、静态检查与构建验证。
#
# 这里刻意不做任何发布动作。发布由 Release.yml 负责，只在
# 「发布 Release」或手动触发时执行，避免同一份产物被推两次。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt / clippy / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --features extension-module -- -D warnings
      - uses: astral-sh/setup-uv@v7
      - name: ruff
        run: uvx ruff check

  build-linux:
    name: build wheel (linux ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # auto(=manylinux2014) 的 cross 镜像 GCC 太老，ring 的 ARM 汇编会编译失败
          manylinux: manylinux_2_28
          args: --release --out dist
      - name: Smoke test the built wheel
        run: |
          set -uo pipefail
          # 交叉编译的 wheel 装不进宿主平台（架构不符或跨 OS），必须跳过而不是当失败。
          host="$(uname -m)"
          sysname="$(uname -s)"
          # wheel 平台标签的 OS 前缀。不能用 case 的 `$var*` 给多个前缀做择一：
          # 变量内容里的 `|` 会被当成字面字符，必须逐个前缀循环匹配。
          case "$sysname" in
            Linux) osp="manylinux musllinux linux" ;;
            Darwin) osp="macosx" ;;
            MINGW*|MSYS*|CYGWIN*) osp="win" ;;
            *) osp="" ;;
          esac
          # 架构在不同平台写法不同：x86_64(Linux) / amd64(Windows) / x86_64|amd64(macOS)；
          # aarch64(Linux) / arm64(Windows、macOS)。必须用 case 而不是 ${v//a/b}：
          # CI 的 run 步骤默认 /bin/sh(dash)，不支持该展开。
          case "$host" in
            x86_64|amd64) aalias="x86_64 amd64" ;;
            aarch64|arm64) aalias="aarch64 arm64" ;;
            i386|i486|i586|i686) aalias="i686" ;;
            *) aalias="$host" ;;
          esac
          echo "host=${host} sysname=${sysname} os_prefix=[${osp}] arch_alias=[${aalias}]"
          ok=0
          for whl in dist/*.whl; do
            platform="${whl##*-}"; platform="${platform%.whl}"

            os_ok=0
            for p in $osp; do
              case "$platform" in "$p"*) os_ok=1 ;; esac
            done
            if [ "$os_ok" != 1 ]; then
              echo "==> skip $whl (platform=$platform 不属于本 OS: ${sysname})"
              continue
            fi

            arch_ok=0
            for a in $aalias; do
              case "$platform" in "$a"|*"_$a"|*"-$a") arch_ok=1 ;; esac
            done
            if [ "$arch_ok" = 1 ]; then
              echo "==> INSTALL $whl (platform=$platform)"
              python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
              python -c "import ncm_api_py; print('import OK:', ncm_api_py.__file__)"
              ok=1
            else
              echo "==> skip $whl (platform=$platform, host arch=${host})"
            fi
          done
          [ "$ok" = 1 ] || echo "==> 交叉编译目标，未做运行时验证"

  build-native:
    name: build wheel (${{ matrix.runner }}/${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Smoke test the built wheel
        shell: bash
        run: |
          set -uo pipefail
          # 交叉编译的 wheel 装不进宿主平台（架构不符或跨 OS），必须跳过而不是当失败。
          host="$(uname -m)"
          sysname="$(uname -s)"
          # wheel 平台标签的 OS 前缀。不能用 case 的 `$var*` 给多个前缀做择一：
          # 变量内容里的 `|` 会被当成字面字符，必须逐个前缀循环匹配。
          case "$sysname" in
            Linux) osp="manylinux musllinux linux" ;;
            Darwin) osp="macosx" ;;
            MINGW*|MSYS*|CYGWIN*) osp="win" ;;
            *) osp="" ;;
          esac
          # 架构在不同平台写法不同：x86_64(Linux) / amd64(Windows) / x86_64|amd64(macOS)；
          # aarch64(Linux) / arm64(Windows、macOS)。必须用 case 而不是 ${v//a/b}：
          # CI 的 run 步骤默认 /bin/sh(dash)，不支持该展开。
          case "$host" in
            x86_64|amd64) aalias="x86_64 amd64" ;;
            aarch64|arm64) aalias="aarch64 arm64" ;;
            i386|i486|i586|i686) aalias="i686" ;;
            *) aalias="$host" ;;
          esac
          echo "host=${host} sysname=${sysname} os_prefix=[${osp}] arch_alias=[${aalias}]"
          ok=0
          for whl in dist/*.whl; do
            platform="${whl##*-}"; platform="${platform%.whl}"

            os_ok=0
            for p in $osp; do
              case "$platform" in "$p"*) os_ok=1 ;; esac
            done
            if [ "$os_ok" != 1 ]; then
              echo "==> skip $whl (platform=$platform 不属于本 OS: ${sysname})"
              continue
            fi

            arch_ok=0
            for a in $aalias; do
              case "$platform" in "$a"|*"_$a"|*"-$a") arch_ok=1 ;; esac
            done
            if [ "$arch_ok" = 1 ]; then
              echo "==> INSTALL $whl (platform=$platform)"
              python -m pip install --force-reinstall --no-index --find-links dist ncm-api-py
              python -c "import ncm_api_py; print('import OK:', ncm_api_py.__file__)"
              ok=1
            else
              echo "==> skip $whl (platform=$platform, host arch=${host})"
            fi
          done
          [ "$ok" = 1 ] || echo "==> 交叉编译目标，未做运行时验证"
